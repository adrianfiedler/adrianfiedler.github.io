document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ystem-ui, sans-serif;\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n    --serif: 'Newsreader', Georgia, serif;\n    --gutter: clamp(20px, 3vw, 48px);\n    --step: 24px;\n  }\n  html[data-dark=\"true\"] {\n    --bg: #0f0e10;\n    --bg-2: #1a181c;\n    --ink: #f0eee8;\n    --ink-2: #b8b4ab;\n    --ink-3: #74706a;\n    --rule: #2a2730;\n    --paper: #161418;\n  }\n  html[data-density=\"dense\"] { --step: 16px; }\n  html[data-density=\"spacious\"] { --step: 36px; }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: var(--sans);\n    background: var(--bg);\n    color: var(--ink);\n    font-size: 15px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    font-feature-settings: \"ss01\", \"cv11\";\n  }\n  ::selection { background: var(--accent); color: var(--accent-ink); }\n\n  a { color: inherit; text-decoration: none; }\n  a.link { border-bottom: 1px solid var(--rule); transition: border-color .2s, color .2s; }\n  a.link:hover { border-bottom-color: var(--accent); color: var(--accent); }\n\n  /* Grid overlay (tweak) */\n  body[data-grid=\"true\"]::before {\n    content: '';\n    position: fixed; inset: 0;\n    background-image: linear-gradient(to right, rgba(184,85,44,0.08) 1px, transparent 1px);\n    background-size: calc(100% / 12) 100%;\n    pointer-events: none; z-index: 9999;\n  }\n\n  /* ===== Top bar ===== */\n  .topbar {\n    position: sticky; top: 0; z-index: 50;\n    background: color-mix(in srgb, var(--bg) 88%, transparent);\n    backdrop-filter: saturate(1.2) blur(10px);\n    border-bottom: 1px solid var(--rule);\n  }\n  .topbar-inner {\n    max-width: 1320px; margin: 0 auto;\n    padding: 12px var(--gutter);\n    display: grid; grid-template-columns: 1fr auto 1fr;\n    align-items: center; gap: 24px;\n    font-family: var(--mono); font-size: 12px;\n    color: var(--ink-2);\n  }\n  .topbar-left { display: flex; gap: 18px; align-items: center; }\n  .mark {\n    font-family: var(--sans); font-weight: 600; letter-spacing: -0.01em;\n    color: var(--ink); font-size: 14px;\n  }\n  .mark .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; transform: translateY(-1px); }\n  .status { display: inline-flex; align-items: center; gap: 6px; }\n  .status .pulse { position: relative; width: 7px; height: 7px; border-radius: 50%; background: #4aa86c; }\n  .status .pulse::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:1px solid #4aa86c; animation: pulse 2s ease-out infinite; }\n  @keyframes pulse { 0%{transform:scale(0.6); opacity:1;} 100%{transform:scale(1.4); opacity:0;} }\n\n  .topbar-center { display: flex; gap: 4px; justify-content: center; }\n  .nav-link {\n    font-family: var(--mono); font-size: 12px;\n    padding: 6px 10px; border-radius: 4px;\n    color: var(--ink-2); transition: background .15s, color .15s;\n  }\n  .nav-link:hover { background: var(--bg-2); color: var(--ink); }\n  .nav-link .num { color: var(--ink-3); margin-right: 6px; }\n\n  .topbar-right { display: flex; justify-content: flex-end; gap: 16px; align-items: center; }\n  .cmd-btn {\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 6px 10px; border-radius: 5px;\n    background: var(--bg-2); color: var(--ink-2);\n    border: 1px solid var(--rule);\n    font-family: var(--mono); font-size: 11px;\n    cursor: pointer; transition: all .15s;\n  }\n  .cmd-btn:hover { border-color: var(--accent); color: var(--accent); }\n  .kbd {\n    font-family: var(--mono); font-size: 10px;\n    padding: 1px 5px; border-radius: 3px;\n    background: var(--paper); border: 1px solid var(--rule);\n    color: var(--ink-3);\n    box-shadow: 0 1px 0 var(--rule);\n  }\n\n  /* ===== Layout ===== */\n  .page { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter); }\n  section { padding: calc(var(--step) * 2.5) 0; border-bottom: 1px solid var(--rule); }\n  section:last-of-type { border-bottom: none; }\n\n  .section-head {\n    display: grid; grid-template-columns: 180px 1fr; gap: 40px;\n    margin-bottom: calc(var(--step) * 1.5);\n    align-items: start;\n  }\n  .section-label {\n    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;\n    color: var(--ink-3); text-transform: uppercase;\n    padding-top: 6px;\n    display: flex; gap: 10px; align-items: baseline;\n  }\n  .section-label .hash { color: var(--accent); }\n  .section-title {\n    font-family: var(--sans); font-weight: 500; letter-spacing: -0.02em;\n    font-size: clamp(26px, 3.2vw, 38px); line-height: 1.1;\n    margin: 0; color: var(--ink);\n    max-width: 22ch;\n  }\n  .section-title em {\n    font-family: var(--serif); font-style: italic; font-weight: 400;\n    color: var(--accent);\n  }\n\n  /* ===== Hero / Terminal ===== */\n  .hero {\n    padding-top: calc(var(--step) * 2);\n    padding-bottom: calc(var(--step) * 3);\n  }\n  .hero-grid {\n    display: grid;\n    grid-template-columns: 1.3fr 1fr;\n    gap: 60px;\n    align-items: start;\n  }\n  .hero-left h1 {\n    font-family: var(--sans); font-weight: 400;\n    font-size: clamp(44px, 6.4vw, 88px);\n    line-height: 0.98; letter-spacing: -0.035em;\n    margin: 0 0 32px;\n    color: var(--ink);\n  }\n  .hero-left h1 .line-2 { display: block; color: var(--ink-2); }\n  .hero-left h1 em {\n    font-family: var(--serif); font-style: italic; font-weight: 400;\n    color: var(--accent); letter-spacing: -0.02em;\n  }\n  .hero-tag {\n    font-family: var(--mono); font-size: 12px; color: var(--ink-3);\n    letter-spacing: 0.04em; text-transform: uppercase;\n    margin-bottom: 24px;\n    display: flex; gap: 14px; align-items: center;\n  }\n  .hero-tag .divider { width: 24px; height: 1px; background: var(--ink-3); }\n\n  .hero-meta {\n    display: grid; grid-template-columns: repeat(3, 1fr);\n    gap: 1px; background: var(--rule);\n    border: 1px solid var(--rule);\n    margin-top: 40px;  <\u002Fdiv>\n          <div class=\"term-body\" id=\"term-body\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ABOUT ============ -->\n  <section id=\"about\" data-screen-label=\"02 Über mich\">\n    <div class=\"section-head\">\n      <div class=\"section-label\"><span class=\"hash\">§01<\u002Fspan><span>Profil<\u002Fspan><\u002Fdiv>\n      <h2 class=\"section-title\">Pragmatischer Engineer mit <em>Anspruch an Handwerk<\u002Fem>.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"about-grid\">\n      <div>\n        <div class=\"photo-card\">\n          <img src=\"d02f10e4-f247-4390-aa1b-6bd890113000\" alt=\"Portrait Adrian Fiedler\">\n          <div class=\"photo-caption\">ADRIAN FIEDLER · MÜNCHEN<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-body\">\n        <p>Ich bin Java Fullstack Developer mit Schwerpunkt auf JEE und Web-Anwendungen — von klassischen JSF-Oberflächen bis zu schlanken HTML/JavaScript-Frontends. „Serverless\"-Alternativen wie Quarkus setze ich gerne ein, wenn sie passen, und trage aktiv als Open-Source-Contributor zum Projekt bei.<\u002Fp>\n        <p>Vor meiner Zeit als Java-Entwickler war ich professioneller iOS-Entwickler — ein Handwerk, das ich bis heute als Hobby pflege. Teil meiner UI-Expertise ist es außerdem, Webseiten barrierefrei umzusetzen; ich habe mehrere Projekte sicher durch die abschließende BITV/WCAG-Prüfung geführt.<\u002Fp>\n        <div class=\"about-facts\">\n          <div class=\"fact-row\"><div class=\"k\">Wohnort<\u002Fdiv><div class=\"v\">München, DE<\u002Fdiv><\u002Fdiv>\n          <div class=\"fact-row\"><div class=\"k\">Abschluss<\u002Fdiv><div class=\"v\">M.Sc. Medieninformatik<\u002Fdiv><\u002Fdiv>\n          <div class=\"fact-row\"><div class=\"k\">Arbeitssprache<\u002Fdiv><div class=\"v\">Deutsch · Englisch<\u002Fdiv><\u002Fdiv>\n          <div class=\"fact-row\"><div class=\"k\">Zertifikat<\u002Fdiv><div class=\"v\">PSM I —        <p>Mehrere Großprojekte sicher durch die abschließende BITV-Prüfung geführt. Accessibility von Anfang an mitgedacht — nicht als Nachtrag.<\u002Fp>\n        <ul>\n          <li>BITV 2.0 / WCAG 2.1/2.2<\u002Fli>\n          <li>ARIA, Tastaturnavigation<\u002Fli>\n          <li>Screenreader-Kompatibilität<\u002Fli>\n          <li>Audits &amp; Remediation<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"service\">\n        <div class=\"num\">04 / SERVICE<\u002Fdiv>\n        <h3>Quarkus &amp; Cloud-Native<\u002Fh3>\n        <p>Moderne, schlanke Services statt schwergewichtiger Monolithen. Ideal für Container, schnelle Starts und sparsame Ressourcen — Open-Source-Contributor des Ökosystems.<\u002Fp>\n        <ul>\n          <li>Quarkus, Reactive Programming<\u002Fli>\n          <li>Microservices, REST, gRPC<\u002Fli>\n          <li>Container &amp; Kubernetes<\u002Fli>\n          <li>Observability (Prometheus/Grafana)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"service\">\n        <div class=\"num\">05 / SERVICE<\u002Fdiv>\n        <h3>Mobile — iOS<\u002Fh3>\n        <p>Früher hauptberuflich, heute mit Leidenschaft: native iOS-Anwendungen mit sauberer Architektur. Mehrere eigene Apps im App Store veröffentlicht.<\u002Fp>\n        <ul>\n          <li>Swift, UIKit, SwiftUI<\u002Fli>\n          <li>Offline-Speicherung &amp; Sync<\u002Fli>\n          <li>Push Notifications<\u002Fli>\n          <li>App Store Releases<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"service\">\n        <div class=\"num\">06 / SERVICE<\u002Fdiv>\n        <h3>Agile Delivery<\u002Fh3>\n        <p>Zertifizierter Scrum Master mit jahrelanger Erfahrung in großskalierten agilen Projekten — inkl. 300+-Personen-SAFe-Programmen.<\u002Fp>\n        <ul>\n          <li>Scrum (PSM I, Scrum.org)<\u002Fli>\n          <li>SAFe — Scaled Agile Framework<\u002Fli>\n          <li>Testautomatisierung als Kultur<\u002Fli>\n          <li>CI/CD Pipel n('term-dim', step.s)); break;\n      case 'path':   line.appendChild(span('term-path', step.s)); break;\n      case 'out':    line.appendChild(span('term-out', step.s)); break;\n      case 'dim':    line.appendChild(span('term-dim', step.s)); break;\n      case 'key':    line.appendChild(span('term-key', step.s)); break;\n      case 'str':    line.appendChild(span('term-str', step.s)); break;\n      case 'newline':\n        line = document.createElement('div'); line.className = 'term-line'; termBody.appendChild(line);\n        break;\n      case 'type': {\n        const cmdSpan = span('term-cmd', '');\n        line.appendChild(cmdSpan);\n        for (const ch of step.s) { cmdSpan.textContent += ch; await sleep(35 + Math.random() * 40); }\n        await sleep(step.delay || 300);\n        break;\n      }\n      case 'json': {\n        const jsonLines = [\n          { parts: [['term-dim', '{']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"java\"'], ['term-dim', ': '], ['term-str', '\"jee, ejb, jpa, quarkus\"'], ['term-dim', ',']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"frontend\"'], ['term-dim', ': '], ['term-str', '\"jsf, primefaces, html/js\"'], ['term-dim', ',']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"processes\"'], ['term-dim', ': '], ['term-str', '\"camunda, jbpm\"'], ['term-dim', ',']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"a11y\"'], ['term-dim', ': '], ['term-str', '\"bitv 2.0, wcag 2.1\"'], ['term-dim', ',']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"ops\"'], ['term-dim', ': '], ['term-str', '\"docker, openshift, ci/cd\"'], ['term-dim', ',']] },\n          { parts: [['term-dim', '  '], ['term-key', '\"method\"'], ['term-dim', ': '], ['term-str', '\"scrum (psm i), safe\"']] },\n          { parts: [['term-dim', '}']] }\n        ];\n        for (const jl of jsonLines) {\n          line = document.createElement('div'); line.className = 'term-line'; termBody.appendChild(line);\n          for (const [cls, txt] of jl.parts) line.appendChild(span(cls, txt));\n          await sleep(70);\n        }\n        break;\n      }\n      case 'cursor':\n        line.appendChild(span('cursor', ''));\n        line.lastChild.textContent = '';\n        const c = document.createElement('span'); c.className = 'cursor'; line.appendChild(c);\n        break;\n    }\n  }\n}\nplayTerminal();\n\n/* ============ COMMAND PALETTE ============ */\nconst palette = {\n  items: [\n    { group: 'Navigation', label: 'Über mich',         hint: '§01',  icon: '→', action: () => goto('about') },\n    { group: 'Navigation', label: 'Leistungen',        hint: '§02',  icon: '→', action: () => goto('services') },\n    { group: 'Navigation', label: 'Tech Stack',        hint: '§03',  icon: '→', action: () => goto('stack') },\n    { group: 'Navigation', label: 'Projekthistorie',   hint: '§04',  icon: '→', action: () => goto('projects') },\n    { group: 'Navigation', label: 'Zertifikate & OSS', hint: '§05',  icon: '→', action: () => goto('certs') },\n    { group: 'Navigation', label: 'Verfügbarkeit',     hint: '§06',  icon: '→', action: () => goto('availability') },\n    { group: 'Navigation', label: 'Kontakt',           hint: '§07',  icon: '→', action: () => goto('contact') },\n\n    { group: 'Projekte', label: 'XRAIL — Senior Java (2023)',      hint: 'freelance',   icon: '▸', action: () => goto('projects') },\n    { group: 'Projekte', label: 'Glasfaserausbau (2018–2022)',     hint: 'festanstellung', icon: '▸', action: () => goto('projects') },\n    { group: 'Projekte', label: 'Breitbandausbau Nah (2017–2018)', hint: 'festanstellung', icon: '▸', action: () => goto('projects') },\n    { group: 'Projekte', label: 'Breitbandausbau (2016–2017)',     hint: 'festanstellung', icon: '▸', action: () => goto('projects') },\n    { group: 'Projekte', label: 'iOS — Agrar-Konzern (2014–2017)', hint: 'mobile',      icon: '▸', action: () => goto('projects') },\n\n    { group: 'Aktionen', label: 'E-Mail an Adrian schreiben',  hint: 'mailto',  icon: '✉', action: () => location.href = 'mailto:adrian_fiedler@msn.com' },\n    { group: 'Aktionen', label: 'GitHub-Profil öffnen',         hint: 'extern',  icon: '↗', action: () => window.open('https://github.com/adrianfiedler','_blank') },\n    { group: 'Aktionen', label: 'PSM I Zertifikat (PDF)',       hint: 'extern',  icon: '↗', action: () => window.open('https://adrianfiedler.github.io/pdf/PSMI.pdf','_blank') },\n    { group: 'Aktionen', label: 'Quarkus Projekt besuchen',     hint: 'extern',  icon: '↗', action: () => window.open('https://quarkus.io/','_blank') },\n\n    { group: 'Theme',   label: 'Hell / Dunkel umschalten',      hint: '⌘D',  icon: '☀', action: () => persist({ dark: !state.dark }) },\n    { group: 'Theme',   label: 'Accent: Terrakotta',            hint: '',    icon: '●', action: () => persist({ accent: '#b8552c' }) },\n    { group: 'Theme',   label: 'Accent: Blau',                  hint: '',    icon: '●', action: () => persist({ accent: '#1a5fb4' }) },\n    { group: 'Theme',   label: 'Accent: Forest',                hint: '',    icon: '●', action: () => persist({ accent: '#2e6b4f' }) }\n  ]\n};\n\nfunction goto(id) {\n  const el = document.getElementById(id);\n  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n}\n\nconst cmdk = document.getElementById('cmdk');\nconst cmdkInput = document.getElementById('cmdk-input');\nconst cmdkList = document.getElementById('cmdk-list');\nlet activeIdx = 0;\nlet filtered = palette.items;\n\nfunction renderPalette() {\n  cmdkList.innerHTML = '';\n  const groups = {};\n  filtered.forEach((it, i) => {\n    groups[it.group] ||= [];\n    groups[it.group].push({ ...it, i });\n  });\n  let flatIdx = 0;\n  Object.entries(groups).forEach(([g, items]) => {\n    const h = document.createElement('div'); h.className = 'cmdk-section-h'; h.textContent = g;\n    cmdkList.appendChild(h);\n    items.forEach(it => {\n      const row = document.createElement('div');\n      row.className = 'cmdk-item' + (flatIdx === activeIdx ? ' active' : '');\n      row.dataset.idx = flatIdx;\n      row.innerHTML = `<span class=\"ico\">${it.icon}<\u002Fspan><span class=\"label\">${it.label}<\u002Fspan><span class=\"hint\">${it.hint}<\u002Fspan>`;\n      row.addEventListener('mouseenter', () => { activeIdx = Number(row.dataset.idx); renderPalette(); });\n      row.addEventListener('click', () => { closePalette(); it.action(); });\n      cmdkList.appendChild(row);\n      flatIdx++;\n    });\n  });\n}\n\nfunction openPalette() {\n  cmdk.classList.add('open');\n  cmdkInput.value = '';\n  filtered = palette.items;\n  activeIdx = 0;\n  renderPalette();\n  setTimeout(() => cmdkInput.focus(), 50);\n}\nfunction closePalette() { cmdk.classList.remove('open'); }\n\ndocument.getElementById('cmdk-open').addEventListener('click', openPalette);\ncmdk.addEventListener('click', (e) => { if (e.target === cmdk) closePalette(); });\n\ncmdkInput.addEventListener('input', (e) => {\n  const q = e.target.value.trim().toLowerCase();\n  filtered = palette.items.filter(it =>\n    it.label.toLowerCase().includes(q) || it.group.toLowerCase().includes(q) || (it.hint||'').toLowerCase().includes(q)\n  );\n  activeIdx = 0;\n  renderPalette();\n});\n\ndocument.addEventListener('keydown', (e) => {\n  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.classList.contains('open') ? closePalette() : openPalette(); return; }\n  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); persist({ dark: !state.dark }); return; }\n  if (!cmdk.classList.contains('open')) return;\n  if (e.key === 'Escape') { closePalette(); }\n  else if (e.key === 'ArrowDown') { activeIdx = Math.min(filtered.length - 1, activeIdx + 1); renderPalette(); e.preventDefault(); }\n  else if (e.key === 'ArrowUp')   { activeIdx = Math.max(0, activeIdx - 1); renderPalette(); e.preventDefault(); }\n  else if (e.key === 'Enter')     { const item = filtered[activeIdx]; if (item) { closePalette(); item.action(); } }\n});\n\n/* ============ TWEAKS — embed panel + parent toggle ============ */\nconst tweaksPanel = document.getElementById('tweaks-panel');\ndocument.getElementById('tweaks-close').addEventListener('click', () => {\n  tweaksPanel.classList.remove('open');\n  window.parent.postMessage({type: '__edit_mode_deactivated'}, '*');\n});\n\ndocument.querySelectorAll('#swatches .swatch').forEach(btn => {\n  btn.addEventListener('click', () => persist({ accent: btn.dataset.accent }));\n});\ndocument.querySelectorAll('#seg-theme button').forEach(btn => {\n  btn.addEventListener('click', () => persist({ dark: btn.dataset.theme === 'dark' }));\n});\ndocument.querySelectorAll('#seg-density button').forEach(btn => {\n  btn.addEventListener('click', () => persist({ density: btn.dataset.density }));\n});\ndocument.querySelectorAll('#seg-grid button').forEach(btn => {\n  btn.addEventListener('click', () => persist({ showGrid: btn.dataset.grid === 'true' }));\n});\n\n/* Register edit-mode listener BEFORE announcing availability */\nwindow.addEventListener('message', (ev) => {\n  const d = ev.data || {};\n  if (d.type === '__activate_edit_mode') tweaksPanel.classList.add('open');\n  if (d.type === '__deactivate_edit_mode') tweaksPanel.classList.remove('open');\n});\nwindow.parent.postMessage({type: '__edit_mode_available'}, '*');\n\napplyState();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
